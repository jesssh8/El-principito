<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFF9F2">
<meta name="mobile-web-app-capable" content="yes">
<title>El principito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <div id="hud">
    <button class="chip" id="btnPause" aria-label="Pausa">
      <svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="#B8785C"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="#B8785C"/></svg>
    </button>
    <div class="chip" id="chipH">Altura <b id="hAlt">0</b> m</div>
    <div class="chip" id="chipS"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="hStars">0</b></div>
  </div>

  <div id="toast"></div>

  <section class="screen on" id="sMenu">
    <div class="card titleCard">
      <div class="flourish">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21C5 15.5 3 11.5 3 8.5A4.6 4.6 0 0 1 12 6.6 4.6 4.6 0 0 1 21 8.5c0 3-2 7-9 12.5z" fill="#F4A0B5" stroke="#B8785C" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <h1>Sube hasta las estrellas.</h1>
      <p>El principito</p>
    </div>
    <div class="menuBottom">
      <div class="stats">
        <div class="chip">Récord <b id="mBest">0</b> m</div>
        <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="mCoins">0</b></div>
      </div>
      <button class="btn big b-rose" id="bPlay">Jugar</button>
      <div class="row">
        <button class="btn b-lav" id="bShop">Tienda de cartas</button>
        <button class="btn small b-sky" id="bSnd" aria-label="Sonido">♪</button>
      </div>
    </div>
  </section>

  <section class="screen veil" id="sShop">
    <div class="shopHead"><h2>Tienda de cartas</h2>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="shCoins">0</b></div></div>
    <div id="shopList"></div>
    <div class="row"><button class="btn b-sage" id="bSimple">Traje sencillo</button><button class="btn b-peach" id="bShopBack">Volver</button></div>
  </section>

  <section class="screen veil" id="sOver">
    <div class="card overCard">
      <h2>Siempre puedes volver a intentarlo.</h2>
      <div class="sc">Altura <b id="oAlt">0</b> m &nbsp;·&nbsp; Récord <b id="oBest">0</b> m</div>
      <div class="sc">Estrellas y corazones <b id="oStars">0</b></div>
      <div class="newrec" id="oNew">¡Nuevo récord!</div>
    </div>
    <div class="col">
      <button class="btn b-yel" id="bRevive">Revivir <span id="reviveCost">110</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <button class="btn big b-rose" id="bAgain">Volver a volar</button>
      <div class="row"><button class="btn b-lav" id="bOverShop">Tienda</button><button class="btn b-sky" id="bOverMenu">Inicio</button></div>
    </div>
  </section>

  <section class="screen veil" id="sPause">
    <h2>En pausa</h2>
    <button class="btn big b-sage" id="bResume">Seguir</button>
    <button class="btn b-sky" id="bQuit">Salir al inicio</button>
  </section>

  <section class="screen top" id="sLetter">
    <div class="card letter">
      <canvas id="lCv" width="560" height="300"></canvas>
      <p id="lTxt"></p>
      <button class="btn b-rose" id="bLetterClose">Guardar carta</button>
    </div>
  </section>

  <div id="paper"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
