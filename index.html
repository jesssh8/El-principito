<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFF9F2">
<meta name="mobile-web-app-capable" content="yes">
<title>Para Amy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF9F2; --rose:#F4B8C4; --peach:#F9CDAD; --terra:#D98E6B;
  --yellow:#F7DC8B; --sage:#A9C4A0; --sky:#BFE0EE; --lav:#CFC3EA;
  --ink:#5B4338; --line:#7A5F52; --u:1px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#EFE2D0;touch-action:none;overscroll-behavior:none;
  font-family:'Patrick Hand',sans-serif,cursive;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;overflow:hidden;background:var(--cream);touch-action:none;width:360px;height:640px;
  box-shadow:0 0 40px rgba(122,95,82,.25)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#paper{position:absolute;inset:0;pointer-events:none;z-index:50;
  background-image:radial-gradient(ellipse at 50% 46%,rgba(255,249,242,0) 52%,rgba(217,150,110,.26) 100%),var(--paper,none);
  background-size:100% 100%,220px 220px}

/* ---------- piezas de acuarela ---------- */
.chip,.btn,.card{border:calc(var(--u)*2.2) solid var(--line);
  border-radius:255px 16px 225px 18px/18px 225px 16px 255px}
.chip{display:flex;align-items:center;gap:calc(var(--u)*6);font-family:'Caveat',cursive;font-weight:700;
  font-size:calc(var(--u)*24);line-height:1;padding:calc(var(--u)*6) calc(var(--u)*14);color:var(--ink);
  background:radial-gradient(circle at 20% 20%,#FFFDF9,#FBE9D9);
  box-shadow:calc(var(--u)*2) calc(var(--u)*3) 0 rgba(122,95,82,.2)}
.chip b{font-weight:700}
.chip svg{width:calc(var(--u)*22);height:calc(var(--u)*22)}
.btn{font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*27);line-height:1;color:var(--ink);
  padding:calc(var(--u)*9) calc(var(--u)*22);cursor:pointer;
  box-shadow:calc(var(--u)*3) calc(var(--u)*4) 0 rgba(122,95,82,.24),inset 0 0 calc(var(--u)*16) rgba(255,255,255,.4);
  transition:transform .12s;display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*6)}
.btn:active{transform:translateY(calc(var(--u)*2)) scale(.97)}
.btn svg{width:calc(var(--u)*20);height:calc(var(--u)*20)}
.b-rose{background:radial-gradient(circle at 30% 25%,#FDDCE3,#F4A9BB)}
.b-peach{background:radial-gradient(circle at 30% 25%,#FFE6D2,#F8BE97)}
.b-sage{background:radial-gradient(circle at 30% 25%,#E2EFD9,#A9C9A0)}
.b-sky{background:radial-gradient(circle at 30% 25%,#E6F4FA,#A9D3E6)}
.b-lav{background:radial-gradient(circle at 30% 25%,#EEE8FA,#C6B8E8)}
.b-yel{background:radial-gradient(circle at 30% 25%,#FFF3C9,#F5D477)}
.btn.big{font-size:calc(var(--u)*40);padding:calc(var(--u)*12) calc(var(--u)*50)}
.btn.small{font-size:calc(var(--u)*22);padding:calc(var(--u)*7) calc(var(--u)*14)}
.btn.dim{opacity:.72}
.card{background:
  radial-gradient(circle at 8% 6%,rgba(244,184,196,.42),transparent 42%),
  radial-gradient(circle at 94% 94%,rgba(207,195,234,.5),transparent 46%),
  radial-gradient(circle at 92% 8%,rgba(247,220,139,.35),transparent 36%),#FFFBF5;
  box-shadow:calc(var(--u)*4) calc(var(--u)*6) 0 rgba(122,95,82,.2)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-start;
  padding:max(calc(var(--u)*10),env(safe-area-inset-top)) calc(var(--u)*10) 0;pointer-events:none;z-index:10}
#hud.on{display:flex}
#btnPause{pointer-events:auto;width:calc(var(--u)*42);height:calc(var(--u)*42);padding:0;justify-content:center;cursor:pointer;
  border-radius:48% 52% 45% 55%/55% 45% 55% 45%}
#btnPause svg{width:calc(var(--u)*18);height:calc(var(--u)*18)}
.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(1.18) rotate(-2deg)}}
#toast{position:absolute;left:0;right:0;top:15%;text-align:center;z-index:30;pointer-events:none;opacity:0;
  font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*34);color:#5B4338;
  text-shadow:0 0 calc(var(--u)*10) #FFF9F2,0 0 calc(var(--u)*4) #FFF9F2;padding:0 calc(var(--u)*20)}
#toast.show{animation:tst 3.8s ease both}
@keyframes tst{0%{opacity:0;transform:translateY(calc(var(--u)*-10))}14%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}

/* ---------- pantallas ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;z-index:20;
  padding:max(calc(var(--u)*22),env(safe-area-inset-top)) calc(var(--u)*18) max(calc(var(--u)*30),env(safe-area-inset-bottom))}
.screen.on{display:flex}
.veil{background:rgba(255,249,242,.62)}
#sMenu{justify-content:space-between}
.titleCard{padding:calc(var(--u)*22) calc(var(--u)*20) calc(var(--u)*24);text-align:center;width:100%;margin-top:calc(var(--u)*6);
  transform:rotate(-1.2deg)}
.titleCard h1{margin:0;font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*40);line-height:.95;color:#C56F52;
  text-shadow:calc(var(--u)*1.5) calc(var(--u)*2) 0 rgba(249,205,173,.9)}
.titleCard p{margin:calc(var(--u)*10) 0 0;font-family:'Caveat',cursive;font-size:calc(var(--u)*25);line-height:1;color:#7A5F52}
.flourish{display:flex;justify-content:center;gap:calc(var(--u)*8);margin-bottom:calc(var(--u)*6)}
.flourish svg{width:calc(var(--u)*20);height:calc(var(--u)*20)}
.menuBottom{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);width:100%}
.stats,.row{display:flex;gap:calc(var(--u)*10);justify-content:center;flex-wrap:wrap}
#sOver{justify-content:center;gap:calc(var(--u)*16)}
.overCard{padding:calc(var(--u)*26) calc(var(--u)*20);text-align:center;width:100%;transform:rotate(.8deg)}
.overCard h2{margin:0 0 calc(var(--u)*12);font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*44);line-height:.95;color:#C56F52}
.sc{font-size:calc(var(--u)*22);line-height:1.5}
.sc b{font-family:'Caveat',cursive;font-size:calc(var(--u)*30)}
.newrec{font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*28);color:#D2708A;display:none}
.newrec.on{display:block}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*10);align-items:center;width:100%}
#sPause{justify-content:center;gap:calc(var(--u)*14)}
#sPause h2,.shopHead h2{margin:0;font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*44);color:#C56F52}
#sShop{justify-content:flex-start;gap:calc(var(--u)*10)}
.shopHead{display:flex;width:100%;justify-content:space-between;align-items:center}
#shopList{display:flex;flex-direction:column;gap:calc(var(--u)*12);width:100%;flex:1;min-height:0;justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*8);scrollbar-width:none}
#shopList::-webkit-scrollbar{display:none}
.shopRow{flex:none}
.shopRow{display:flex;align-items:center;gap:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*12)}
.shopRow.eq{outline:calc(var(--u)*3) dashed #E39A7A;outline-offset:calc(var(--u)*2)}
.shopRow canvas{width:calc(var(--u)*56);height:calc(var(--u)*70);flex:none}
.shopRow .info{flex:1;min-width:0}
.nm{font-family:'Caveat',cursive;font-weight:700;font-size:calc(var(--u)*25);line-height:1}
.ds{font-size:calc(var(--u)*15);line-height:1.1;margin-top:calc(var(--u)*3);opacity:.85}
.acts{display:flex;flex-direction:column;gap:calc(var(--u)*6);align-items:stretch}
.acts .btn{font-size:calc(var(--u)*20);padding:calc(var(--u)*6) calc(var(--u)*12)}
#sLetter{z-index:40;justify-content:center;background:rgba(122,95,82,.38)}
.letter{width:100%;padding:calc(var(--u)*16) calc(var(--u)*16) calc(var(--u)*20);text-align:center;transform:rotate(-1deg);
  animation:unfold .7s cubic-bezier(.2,1.2,.4,1) both;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12)}
.letter canvas{width:100%;aspect-ratio:280/150;display:block}
.letter p{margin:0;font-family:'Caveat',cursive;font-weight:500;font-size:calc(var(--u)*31);line-height:1.08;color:#4E382F}
@keyframes unfold{from{transform:scale(.4) rotate(8deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.letter{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <div id="hud">
    <button class="chip" id="btnPause" aria-label="Pausa">
      <svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="#B8785C"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="#B8785C"/></svg>
    </button>
    <div class="chip" id="chipH">Altura <b id="hAlt">0</b> m</div>
    <div class="chip" id="chipS"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="hStars">0</b></div>
  </div>

  <div id="toast"></div>

  <section class="screen on" id="sMenu">
    <div class="card titleCard">
      <div class="flourish">
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 21C5 15.5 3 11.5 3 8.5A4.6 4.6 0 0 1 12 6.6 4.6 4.6 0 0 1 21 8.5c0 3-2 7-9 12.5z" fill="#F4A0B5" stroke="#B8785C" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <h1>Si vienes, por ejemplo, a las cuatro de la tarde, comenzaré a ser feliz desde las tres.</h1>
      <p>El principito</p>
    </div>
    <div class="menuBottom">
      <div class="stats">
        <div class="chip">Récord <b id="mBest">0</b> m</div>
        <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="mCoins">0</b></div>
      </div>
      <button class="btn big b-rose" id="bPlay">Jugar</button>
      <div class="row">
        <button class="btn b-lav" id="bShop">Tienda de cartas</button>
        <button class="btn small b-sky" id="bSnd" aria-label="Sonido">♪</button>
      </div>
    </div>
  </section>

  <section class="screen veil" id="sShop">
    <div class="shopHead"><h2>Tienda de cartas</h2>
      <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="shCoins">0</b></div></div>
    <div id="shopList"></div>
    <div class="row"><button class="btn b-sage" id="bSimple">Traje sencillo</button><button class="btn b-peach" id="bShopBack">Volver</button></div>
  </section>

  <section class="screen veil" id="sOver">
    <div class="card overCard">
      <h2>Siempre que caigas estaré para ti.</h2>
      <div class="sc">Altura <b id="oAlt">0</b> m &nbsp;·&nbsp; Récord <b id="oBest">0</b> m</div>
      <div class="sc">Estrellas y corazones <b id="oStars">0</b></div>
      <div class="newrec" id="oNew">¡Nuevo récord!</div>
    </div>
    <div class="col">
      <button class="btn big b-rose" id="bAgain">Volver a volar</button>
      <div class="row"><button class="btn b-lav" id="bOverShop">Tienda</button><button class="btn b-sky" id="bOverMenu">Inicio</button></div>
    </div>
  </section>

  <section class="screen veil" id="sPause">
    <h2>En pausa</h2>
    <button class="btn big b-sage" id="bResume">Seguir</button>
    <button class="btn b-sky" id="bQuit">Salir al inicio</button>
  </section>

  <section class="screen top" id="sLetter">
    <div class="card letter">
      <canvas id="lCv" width="560" height="300"></canvas>
      <p id="lTxt"></p>
      <button class="btn b-rose" id="bLetterClose">Guardar carta</button>
    </div>
  </section>

  <div id="paper"></div>
</div>

<script>
(()=>{
'use strict';
/* ================= CONSTANTES ================= */
const W=360,H=640;
const BL=14000;                 // altura (px) de cada bioma: se tarda bastante en cada uno
const G=0.42,JUMP=12.6,SPRING=19.5,MAXVX=4.6,HW=14,PS=0.8;
const KEY='amy_principito_v1';
const INK='#6E574B';
const $=id=>document.getElementById(id);

/* ================= GUARDADO ================= */
const save={coins:0,best:0,unlocked:[true,false,false,false,false],equipped:0,sound:true};
let dirty=false;
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s){
      save.coins=s.coins|0; save.best=s.best|0;
      if(Array.isArray(s.unlocked)) for(let i=0;i<5;i++) save.unlocked[i]=!!s.unlocked[i];
      save.unlocked[0]=true;
      save.equipped=(s.equipped|0); if(!save.unlocked[save.equipped]) save.equipped=0;
      save.sound=s.sound!==false;
    }
  }catch(e){}
}
function persist(){ try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){} dirty=false; }
setInterval(()=>{ if(dirty) persist(); },1000);
addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ persist(); if(state==='play') pauseGame(); } });

/* ================= UTILIDADES ================= */
function R(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rr=R(1); function setSeed(n){rr=R(n);}
const rand=(a,b)=>a+Math.random()*(b-a);
const mod=(a,n)=>((a%n)+n)%n;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sm=t=>t*t*(3-2*t);
function toRGB(s){ if(s[0]==='#'){ s=s.slice(1); return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; } return s.match(/[\d.]+/g).slice(0,3).map(Number); }
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const shade=(s,amt)=>rgb(toRGB(s).map(v=>clamp(v+amt,0,255)));
const lighten=(s,t)=>rgb(mix(toRGB(s),[255,249,242],t));
const mid=(p,q)=>({x:(p.x+q.x)/2,y:(p.y+q.y)/2});

/* ================= PRIMITIVAS DE ACUARELA Y LÁPIZ ================= */
function smooth(c,pts){
  const n=pts.length; c.beginPath();
  const m=mid(pts[n-1],pts[0]); c.moveTo(m.x,m.y);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],mm=mid(p,q);c.quadraticCurveTo(p.x,p.y,mm.x,mm.y);}
  c.closePath();
}
function ellP(cx,cy,rx,ry,r,n,j){n=n||12;j=j==null?.06:j;const a=[],o=r()*6.283;
  for(let i=0;i<n;i++){const t=o+i/n*6.283,k=1+(r()-.5)*2*j;a.push({x:cx+Math.cos(t)*rx*k,y:cy+Math.sin(t)*ry*k});}return a;}
function rectP(x,y,w,h,rad,r,j){const J=()=>(r()-.5)*2*(j||0);
  return[{x:x+rad+J(),y:y+J()},{x:x+w-rad+J(),y:y+J()},{x:x+w+J(),y:y+rad+J()},{x:x+w+J(),y:y+h-rad+J()},
         {x:x+w-rad+J(),y:y+h+J()},{x:x+rad+J(),y:y+h+J()},{x:x+J(),y:y+h-rad+J()},{x:x+J(),y:y+rad+J()}];}
function starP(cx,cy,R0,r){const a=[];for(let i=0;i<10;i++){const rad=i%2?R0*.5:R0,t=-Math.PI/2+i*Math.PI/5;
  a.push({x:cx+Math.cos(t)*rad*(1+(r()-.5)*.06),y:cy+Math.sin(t)*rad*(1+(r()-.5)*.06)});}return a;}
function heartP(cx,cy,sc){const a=[];for(let i=0;i<20;i++){const t=i/20*6.283;
  a.push({x:cx+sc*16*Math.pow(Math.sin(t),3),y:cy-sc*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))});}return a;}
function shape(c,pts,color,o){
  o=o||{}; const a=o.a==null?.9:o.a;
  c.save(); c.fillStyle=color;
  c.globalAlpha=a*.62; smooth(c,pts); c.fill();
  const p2=pts.map(p=>({x:p.x+(rr()-.5)*1.7,y:p.y+(rr()-.5)*1.7}));
  c.globalAlpha=a*.55; smooth(c,p2); c.fill();
  if(o.edge!==false){c.globalAlpha=a*.55;c.lineWidth=1.4;c.strokeStyle=shade(color,-24);smooth(c,pts);c.stroke();}
  if(o.pen!==false){const p3=pts.map(p=>({x:p.x+(rr()-.5)*1.3,y:p.y+(rr()-.5)*1.3}));
    c.globalAlpha=.5;c.lineWidth=.9;c.lineCap='round';c.strokeStyle=INK;smooth(c,p3);c.stroke();}
  c.restore();
}
function hl(c,cx,cy,rx,ry,col,a){c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,6.2832);c.fill();c.restore();}
function curve(c,pts,col,lw,a){c.save();c.globalAlpha=a==null?.8:a;c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){const m=mid(pts[i],pts[i+1]);c.quadraticCurveTo(pts[i].x,pts[i].y,m.x,m.y);}
  const l=pts[pts.length-1];c.lineTo(l.x,l.y);c.stroke();c.restore();}

/* ================= SPRITES (se generan una vez; nitidez según pantalla) ================= */
let S=1; const SP={};
function mk(w,h,fn){const cv=document.createElement('canvas');cv.width=Math.ceil(w*S);cv.height=Math.ceil(h*S);
  const c=cv.getContext('2d');c.scale(S,S);cv.lw=w;cv.lh=h;fn(c,w,h);return cv;}
function spr(c,cv,x,y,s){s=s||1;c.drawImage(cv,x,y,cv.lw*s,cv.lh*s);}

const OUT=[
  {name:'Pequeño viajero',tunic:'#F1DEC4',tunic2:'#DDBF98',scarf:'#F6B7A2',tail:'#F6B7A2',hair:'#C79C6E',shoe:'#C98A66',kind:0},
  {name:'El Principito',price:200,tunic:'#A9C9A0',tunic2:'#86AB8B',scarf:'#F8DA7E',tail:'#F8DA7E',hair:'#F7D56C',shoe:'#C98A66',kind:1},

/* ================= PAPEL DE ACUARELA ================= */
function buildPaper(){
  const cv=document.createElement('canvas');cv.width=cv.height=220;const c=cv.getContext('2d');
  const r=R(99);
  for(let i=0;i<1500;i++){const x=r()*220,y=r()*220,s=.3+r()*1.1;
    c.fillStyle=r()<.55?`rgba(150,105,75,${.03+r()*.06})`:`rgba(255,255,255,${.1+r()*.16})`;
    c.beginPath();c.arc(x,y,s,0,6.283);c.fill();}
  c.lineCap='round';
  for(let i=0;i<70;i++){const x=r()*220,y=r()*220,l=6+r()*14,a=r()*6.283;
    c.strokeStyle=`rgba(150,110,80,${.03+r()*.05})`;c.lineWidth=.6;c.beginPath();c.moveTo(x,y);
    c.quadraticCurveTo(x+Math.cos(a)*l*.5+2,y+Math.sin(a)*l*.5-2,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}
  $('paper').style.setProperty('--paper',`url(${cv.toDataURL('image/png')})`);
}

/* ================= BIOMAS ================= */
const BIO=[
  {n:'El desierto al atardecer',top:'#C9B7E6',mid:'#F6BDC8',bot:'#FFD8A2'},
  {n:'Aves que cruzan el cielo',top:'#A6D3EA',mid:'#CDE8F1',bot:'#FFF0DA'},
  {n:'El mar de nubes',top:'#D6BCEA',mid:'#F7C5D5',bot:'#FFE1C6'},
  {n:'Cosmos y el asteroide B612',top:'#25224E',mid:'#3D3977',bot:'#6C60A8'}
].map(b=>({...b,r:[b.top,b.mid,b.bot].map(toRGB)}));
function biomeState(h){
  const f=h/BL,i=Math.floor(f);
  if(i>=3) return {i:3,n:3,s:0};
  const t=f-i;
  return {i,n:i+1,s:t>.78?sm((t-.78)/.22):0};
}
const biomeAt=h=>{const s=biomeState(h);return s.s>.5?s.n:s.i;};

const rn=R(2024);
function mkItems(n,ymax,extra){const a=[];for(let i=0;i<n;i++)a.push({x:rn()*W,y:(i+rn()*.8)/n*ymax,v:Math.floor(rn()*2),t:Math.floor(rn()*3),s:.7+rn()*.6,ph:rn()*6.283,sp:5+rn()*9,...(extra?extra(i):{})});return a;}
const ST0=mkItems(14,230),CL1=mkItems(6,700),FL1=[{x:60,y:120,n:7,d:1,sp:22},{x:260,y:430,n:5,d:-1,sp:16},{x:150,y:640,n:6,d:1,sp:26}],
  CL2a=mkItems(9,640),CL2b=mkItems(7,640),CL2c=mkItems(5,640),
  ST3a=mkItems(26,640),ST3b=mkItems(16,640),PL3=[{x:40,y:200,k:0},{x:250,y:720,k:1},{x:170,y:1120,k:2}],AST=[{x:20,y:900}];
let ctx,time=0;
function tile(items,tileH,par,h,fn){
  const off=mod(h*par,tileH);
  for(const it of items)for(let k=-1;k<=0;k++){const y=it.y+off+k*tileH;if(y>H+90||y<-140)continue;fn(it,y);}
}
function cloudAt(it,y,tint,sc,speed){
  const x=mod(it.x+time*it.sp*speed,W+260)-130;
  spr(ctx,SP.cloud[tint][it.v],x,y,sc*it.s);
}
function bird(bx,by,f,col){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=col;ctx.globalAlpha=ctx.globalAlpha*.9;
  for(let pass=0;pass<2;pass++){
    ctx.lineWidth=pass?1.1:2.6;ctx.strokeStyle=pass?INK:col;
    ctx.beginPath();ctx.moveTo(bx-9,by+f*5-2);ctx.quadraticCurveTo(bx-4,by-4-f*2,bx,by);ctx.quadraticCurveTo(bx+4,by-4-f*2,bx+9,by+f*5-2);ctx.stroke();
  }
  ctx.restore();
}
function scenery(bi,a,h){
  if(a<=.01)return;
  ctx.save();ctx.globalAlpha=a;
  if(bi===0){
    for(const it of ST0){const y=it.y*.9+h*.03;if(y>200)continue;ctx.globalAlpha=a*(1-y/200)*.6*(.6+.4*Math.sin(time*2+it.ph));spr(ctx,SP.spark[it.t],it.x,y,it.s*.6);}
    ctx.globalAlpha=a;
    spr(ctx,SP.sun,W*.6-120,300+h*.12-120,1);
    tile(CL1.slice(0,4),700,.16,h,(it,y)=>{ctx.globalAlpha=a*.55;cloudAt(it,y*.75,1,.9,.6);});
    ctx.globalAlpha=a;
    const yy=[445+h*.3,505+h*.55,560+h],fill=['#F0BE9F','#E6A483','#D48F6E'];
    for(let i=0;i<3;i++){const y=yy[i];if(y>H)continue;spr(ctx,SP.dune[i],-20,y);
      const yb=y+199;if(yb<H){ctx.fillStyle=fill[i];ctx.fillRect(0,yb,W,H-yb);}
      if(i===1&&y<H+40){ctx.save();ctx.translate(250,y+crestAt(270,DPH[1])-22);ctx.rotate(-.2);spr(ctx,SP.plane,-45,-23);ctx.restore();}
      if(i===2&&y<H+40){spr(ctx,SP.fox,30,y+crestAt(50,DPH[2])-40);}
    }
  } else if(bi===1){
    ctx.globalAlpha=a*.55;spr(ctx,SP.sun,W*.8-84,110+h*.04-84,.7);ctx.globalAlpha=a;
    tile(CL1,700,.22,h,(it,y)=>{ctx.globalAlpha=a*.92;cloudAt(it,y,0,1,.5);});
    ctx.globalAlpha=a;
    for(const f of FL1){
      const off=mod(h*.34,900);
      for(let k=-1;k<=0;k++){
        const fy=f.y+off+k*900;if(fy>H+60||fy<-80)continue;
        const fx=mod(f.x+f.d*time*f.sp,W+300)-150;
        for(let b=0;b<f.n;b++){const row=Math.ceil(b/2),side=b%2?1:-1;
          bird(fx-f.d*row*14,fy+(b?side*row*8:0),Math.sin(time*7+b*.7),b%3?'#B79FD6':'#E5A48A');}
      }
    }
  } else if(bi===2){
    ctx.globalAlpha=a*.7;spr(ctx,SP.sun,W*.28-110,250+h*.06-110,.9);ctx.globalAlpha=a;
    tile(CL2a,640,.12,h,(it,y)=>{ctx.globalAlpha=a*.6;cloudAt(it,y,2,.8,.3);});
    tile(CL2b,640,.3,h,(it,y)=>{ctx.globalAlpha=a*.85;cloudAt(it,y,1,1.15,.5);});
    tile(CL2c,640,.6,h,(it,y)=>{ctx.globalAlpha=a*.95;cloudAt(it,y,0,1.7,.7);});
  } else {
    tile(ST3a,640,.06,h,(it,y)=>{ctx.globalAlpha=a*(.55+.45*Math.sin(time*2+it.ph));spr(ctx,SP.spark[it.t],it.x,y,it.s*.75);});
    tile(ST3b,640,.16,h,(it,y)=>{ctx.globalAlpha=a*(.6+.4*Math.sin(time*2.6+it.ph));spr(ctx,SP.spark[it.t],it.x,y,it.s*1.1);});
    ctx.globalAlpha=a;
    tile(PL3,1400,.18,h,(it,y)=>{
      if(it.k===0)spr(ctx,SP.planetA,it.x,y,1);else if(it.k===1)spr(ctx,SP.planetB,it.x,y,1);else spr(ctx,SP.moon,it.x,y,1.2);
    });
    tile(AST,2300,.22,h,(it,y)=>{ctx.globalAlpha=a;spr(ctx,SP.ast,it.x+Math.sin(time*.4)*3,y,1.05);});
    const t=mod(time,7);
    if(t<.9){const u=t/.9,x=W*(.95-u*.75),y=50+u*170;
      const g=ctx.createLinearGradient(x,y,x+60,y-30);g.addColorStop(0,'rgba(255,240,190,.95)');g.addColorStop(1,'rgba(255,240,190,0)');
      ctx.globalAlpha=a*(1-u*.6);ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+60,y-30);ctx.stroke();}
  }
  ctx.restore();
}
function drawBG(h){
  const st=biomeState(h),A=BIO[st.i].r,B=BIO[st.n].r,s=st.s;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(mix(A[0],B[0],s)));g.addColorStop(.55,rgb(mix(A[1],B[1],s)));g.addColorStop(1,rgb(mix(A[2],B[2],s)));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  scenery(st.i,1-s,h);
  if(s>0)scenery(st.n,s,h);
}

/* ================= JUEGO ================= */
let state='menu',camY=0,maxH=0,topY=0,plats=[],items=[],parts=[],runStars=0,curB=-1,frameN=0,input=0;
const P={x:W/2,y:580,vx:0,vy:0,face:1,sq:0};
const MENU_Y=430;
const mkPlat=(x,y,w,type)=>({x,y,w,type,dir:Math.random()<.5?-1:1,sp:.8,broken:false,bt:0,fy:0,spring:false,pop:0});

function genRow(){
  const h=580-topY,d=Math.min(1,h/(BL*3));
  const gap=rand(62+d*28,108+d*57);
  topY-=gap;
  const w=Math.round(74-d*18),x=rand(8,W-w-8);
  let type=0;
  if(h>2200&&Math.random()<.12+d*.18)type=1;
  const p=mkPlat(x,topY,w,type);p.sp=.7+d*1.5+Math.random()*.4;
  if(type===0&&h>800&&Math.random()<.07)p.spring=true;
  plats.push(p);
  if(h>3500&&Math.random()<.2+d*.2)plats.push(mkPlat(rand(8,W-w-8),topY+gap*rand(.35,.65),w,2));
  const r=Math.random();
  if(r<.05){items.push({k:0,x:x+w/2,y:topY-44,ph:Math.random()*6});}
  else if(r<.5)items.push({k:0,x:rand(24,W-24),y:topY+gap*.5,ph:0});
  if(Math.random()<.055)items.push({k:1,x:rand(30,W-30),y:topY+gap*.45,ph:0});
}
function reset(){
  camY=0;maxH=0;plats=[];items=[];parts=[];runStars=0;curB=-1;
  plats.push(mkPlat(W/2-45,580,90,0));topY=580;
  while(topY>camY-300)genRow();
  Object.assign(P,{x:W/2,y:580,vx:0,vy:-JUMP,face:1,sq:0});
}
function burst(x,y,cols,n,sp,up){
  for(let i=0;i<n&&parts.length<120;i++)parts.push({x,y,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp*(up||.8),life:0,max:28+Math.random()*22,c:cols[i%cols.length],s:1.8+Math.random()*2.6});
}
function updateParts(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life++;}
  parts=parts.filter(p=>p.life<p.max);
}
function land(p){
  P.y=p.y;let v=JUMP;
  if(p.spring&&Math.abs(P.x-(p.x+p.w/2))<20){v=SPRING;p.pop=1;sfx('spring');burst(P.x,P.y,['#F5A4B8','#F8DA7A','#FFFFFF'],14,5,1.2);}
  else sfx('jump');
  if(p.type===2){p.broken=true;p.bt=0;v*=.85;sfx('crumble');burst(p.x+p.w/2,p.y,['#F0D8C0','#E2B99B'],10,3,.6);}
  P.vy=-v;P.sq=1;
  burst(P.x,P.y,['#F8DDBE','#F4B8C4'],4,2.2,.5);
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function collect(it){
  it.gone=true;
  const v=it.k?5:1;save.coins+=v;runStars+=v;dirty=true;
  $('hStars').textContent=runStars;bump($('chipS'));
  sfx(it.k?'heart':'star');
  burst(it.x,it.y,it.k?['#F29BB1','#FFD6E0','#FFFFFF']:['#F8DA7A','#FFF3C4','#FFFFFF'],it.k?14:8,4.5,1);
}
function step(){
  time+=1/60;
  P.sq*=.84;
  if(state==='menu'){
    P.vy+=G;P.y+=P.vy;
    if(P.y>=MENU_Y&&P.vy>0){P.y=MENU_Y;P.vy=-JUMP;P.sq=1;}
    const nx=W/2+Math.sin(time*1.1)*36;P.vx=(nx-P.x);P.x=nx;if(Math.abs(P.vx)>.05)P.face=P.vx>0?1:-1;
    updateParts();return;
  }
  if(state!=='play'){updateParts();return;}
  if(input!==0){P.vx+=(input*MAXVX-P.vx)*.2;P.face=input;}else P.vx*=.9;
  P.x+=P.vx;
  if(P.x<-12)P.x=W+12;else if(P.x>W+12)P.x=-12;
  const prev=P.y;P.vy=Math.min(P.vy+G,16);P.y+=P.vy;
  for(const p of plats){
    if(p.type===1&&!p.broken){p.x+=p.dir*p.sp;if(p.x<4){p.x=4;p.dir=1;}else if(p.x>W-p.w-4){p.x=W-p.w-4;p.dir=-1;}}
    if(p.broken){p.bt++;p.fy=p.bt*p.bt*.12;}
    if(p.pop>0)p.pop=Math.max(0,p.pop-.06);
  }
  if(P.vy>0){
    for(const p of plats){
      if(p.broken)continue;
      if(P.x+HW>p.x&&P.x-HW<p.x+p.w&&prev<=p.y+1&&P.y>=p.y){land(p);break;}
    }
  }
  const cyp=P.y-22;
  for(const it of items){
    if(it.gone)continue;
    const dx=it.x-P.x,dy=it.y-cyp;
    if(dx*dx+dy*dy<27*27)collect(it);
    else if(Math.abs(dx)>W-30&&Math.abs(dx)<W+20&&dy*dy<700)collect(it);
  }
  const tgt=P.y-H*.42;if(tgt<camY)camY=tgt;
  maxH=Math.max(maxH,580-P.y);
  while(topY>camY-260)genRow();
  if((frameN++%20)===0){
    plats=plats.filter(p=>p.y-camY<H+80&&p.bt<60);
    items=items.filter(i=>!i.gone&&i.y-camY<H+80);
  }
  updateParts();
  const m=Math.floor(maxH/20);
  if(m!==+$('hAlt').textContent)$('hAlt').textContent=m;
  const b=biomeAt(-camY);
  if(b!==curB){curB=b;toast(BIO[b].n);}
  if(P.y-camY>H+60)gameOver();
}

/* ================= DIBUJO ================= */
function drawPlat(p,bi){
  const y=p.y-camY;if(y>H+40||y<-50)return;
  const k=p.w/72,sp=SP.plat[bi][p.type];
  if(p.broken){
    ctx.save();ctx.globalAlpha=Math.max(0,1-p.bt/45);ctx.translate(p.x+p.w/2,y+p.fy);ctx.rotate(p.bt*.018*(p.dir));
    ctx.drawImage(sp,-p.w/2-5*k,-7,sp.lw*k,sp.lh);ctx.restore();return;
  }
  if(p.spring){const s=1+.45*p.pop;spr_(SP.spring,p.x+p.w/2-13,y-27*s+2,1,s);}
  ctx.drawImage(sp,p.x-5*k,y-7,sp.lw*k,sp.lh);
}
function spr_(cv,x,y,sx,sy){ctx.drawImage(cv,x,y,cv.lw*sx,cv.lh*sy);}
function drawPlayerAt(x,y){
  const o=OUT[save.equipped],sp=SP.chars[save.equipped];
  ctx.save();ctx.translate(x,y-camY);ctx.rotate(clamp(P.vx*.035,-.25,.25));
  const stretch=clamp(-P.vy*.008,0,.1);
  ctx.scale(P.face*(1+.18*P.sq-stretch),1-.18*P.sq+stretch);
  // cola de la bufanda / capa
  const ty=-29*PS/.8,len=16+Math.abs(P.vx)*3,fl=clamp(P.vy*1.3,-10,10)+Math.sin(time*12)*2;
  ctx.fillStyle=o.tail;ctx.globalAlpha=.95;ctx.beginPath();ctx.moveTo(-7,ty);
  ctx.quadraticCurveTo(-7-len*.6,ty+fl*.3-4,-7-len,ty+fl);ctx.quadraticCurveTo(-7-len*.5,ty+fl*.3+4,-3,ty+6);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.5;ctx.strokeStyle=INK;ctx.lineWidth=.9;ctx.stroke();ctx.globalAlpha=1;
  ctx.drawImage(sp,-32*PS,-76*PS,64*PS,80*PS);
  ctx.restore();
}
function drawPlayer(){
  for(const dx of [0,-W,W]){const x=P.x+dx;if(x<-40||x>W+40)continue;drawPlayerAt(x,P.y);}
}
function drawItems(){
  for(const it of items){
    if(it.gone)continue;const y=it.y-camY;if(y<-30||y>H+30)continue;
    const yy=y+Math.sin(time*3+it.ph)*3,s=1+.07*Math.sin(time*5+it.ph),sp=it.k?SP.heart:SP.star;
    ctx.drawImage(sp,it.x-16*s,yy-17*s,32*s,34*s);
  }
}
function drawParts(){
  for(const p of parts){
    const a=1-p.life/p.max;ctx.globalAlpha=a*.85;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y-camY,p.s*(.6+a*.5),0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);ctx.globalAlpha=1;
  const h=Math.max(0,-camY);
  drawBG(h);
  if(state==='menu'){
    const my=MENU_Y;ctx.drawImage(SP.plat[0][0],W/2-45-5*1.25,my-7,72*1.25+10*1.25,32);
    drawParts();drawPlayer();return;
  }
  for(const p of plats)drawPlat(p,biomeAt(580-p.y));
  drawItems();drawParts();
  if(state==='play'||state==='pause')drawPlayer();
}

/* ================= AUDIO ================= */
let AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,f2){
  if(!save.sound||!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function sfx(k){
  switch(k){
    case'jump':tone(420,.14,'sine',.04,690);break;
    case'spring':tone(300,.3,'triangle',.06,900);break;
    case'star':tone(880,.1,'sine',.04,1320);break;
    case'heart':tone(660,.12,'sine',.05);setTimeout(()=>tone(990,.2,'sine',.05),90);break;
    case'crumble':tone(170,.2,'sawtooth',.02,80);break;
    case'over':tone(330,.6,'triangle',.05,170);break;
    case'buy':tone(523,.15,'sine',.05);setTimeout(()=>tone(659,.15,'sine',.05),120);setTimeout(()=>tone(784,.3,'sine',.05),240);break;
    case'no':tone(200,.15,'square',.02,150);break;
  }
}

/* ================= INTERFAZ ================= */
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}
function show(id){document.querySelectorAll('.screen:not(.top)').forEach(s=>s.classList.toggle('on',s.id===id));$('hud').classList.toggle('on',id==='');}
function updateMenu(){$('mBest').textContent=save.best;$('mCoins').textContent=save.coins;$('bSnd').style.opacity=save.sound?1:.5;$('bSnd').textContent=save.sound?'♪':'♪̸';}
function toMenu(){
  state='menu';camY=0;plats=[];items=[];parts=[];P.x=W/2;P.y=MENU_Y;P.vy=-JUMP;P.vx=0;P.sq=0;
  show('sMenu');updateMenu();
}
function play(){
  audio();reset();state='play';show('');
  $('hAlt').textContent=0;$('hStars').textContent=0;
}
function pauseGame(){if(state!=='play')return;state='pause';show('sPause');$('hud').classList.add('on');}
function resumeGame(){if(state!=='pause')return;state='play';show('');}
function gameOver(){
  state='over';sfx('over');
  const m=Math.floor(maxH/20),rec=m>save.best;
  if(rec)save.best=m;persist();
  $('oAlt').textContent=m;$('oBest').textContent=save.best;$('oStars').textContent=runStars;
  $('oNew').classList.toggle('on',rec);
  setTimeout(()=>{if(state==='over')show('sOver');},350);
}

const starSVG='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4 6.1 20.7l1.3-6.6L2.5 9.5l6.6-.8z" fill="#F7D774" stroke="#B8785C" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function openShop(){renderShop();show('sShop');}
function renderShop(){
  $('shCoins').textContent=save.coins;
  const L=$('shopList');L.innerHTML='';
  for(let i=1;i<OUT.length;i++){
    const o=OUT[i],un=save.unlocked[i];
    const row=document.createElement('div');row.className='card shopRow'+(save.equipped===i?' eq':'');
    row.innerHTML=`<canvas width="128" height="160"></canvas><div class="info"><div class="nm">${o.name}</div><div class="ds">${un?'Carta desbloqueada':'Desbloquea una carta ilustrada'}</div></div><div class="acts"></div>`;
    const cvp=row.querySelector('canvas');cvp.getContext('2d').drawImage(SP.chars[i],0,0,128,160);
    const acts=row.querySelector('.acts');
    const add=(txt,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.innerHTML=txt;b.addEventListener('click',fn);acts.appendChild(b);};
    if(un){
      add('Ver carta','b-rose',()=>openLetter(i));
      add(save.equipped===i?'Puesto':'Usar','b-sage'+(save.equipped===i?' dim':''),()=>{save.equipped=i;persist();renderShop();});
    } else add('Comprar '+starSVG+o.price,save.coins>=o.price?'b-yel':'b-yel dim',()=>buy(i));
    L.appendChild(row);
  }
}
function buy(i){
  const o=OUT[i];
  if(save.coins<o.price){toast('Te faltan '+(o.price-save.coins)+' estrellas');sfx('no');return;}
  save.coins-=o.price;save.unlocked[i]=true;save.equipped=i;persist();sfx('buy');
  renderShop();openLetter(i);
}
function illus(i,cv){
  const c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,280,150);setSeed(50+i);
  const bg=[null,['#FBD9C8','#F6B9C8'],['#5B549A','#8A80C4'],['#BFE0EE','#F6D5DD'],['#FFE6BE','#F8C9A6']][i];
  const ground=[null,'#A9C9A0','#7C74B8','#A9C9A0','#EBD08C'][i];
  shape(c,rectP(4,4,272,142,26,rr,3),bg[0],{a:.92,pen:false});
  shape(c,ellP(200,60,92,62,rr,10,.12),bg[1],{a:.7,pen:false,edge:false});
  if(i===4)spr(c,SP.sun,148,-14,.72);
  shape(c,ellP(80,142,70,9,rr,10,.1),ground,{a:.8,pen:false,edge:false});
  c.drawImage(SP.chars[i],38,26,90,112.5);
  if(i===1){
    for(let k=0;k<14;k++){const a=k/14*6.283;c.save();c.translate(205+Math.cos(a)*40,66+Math.sin(a)*40);c.rotate(a);
      shape(c,ellP(0,0,12,5.5,rr,8),'#F8D66E');c.restore();}
    shape(c,ellP(205,66,31,31,rr,14,.02),'#FADF8A');
    curve(c,[{x:193,y:60},{x:197,y:56},{x:201,y:60}],'#7A4F45',1.8,.9);
    curve(c,[{x:210,y:60},{x:214,y:56},{x:218,y:60}],'#7A4F45',1.8,.9);
    curve(c,[{x:190,y:71},{x:205,y:86},{x:220,y:71}],'#7A4F45',2,.9);
    hl(c,187,72,6,4,'#F49AAA',.6);hl(c,223,72,6,4,'#F49AAA',.6);
    [[150,22],[250,20],[254,118],[144,110]].forEach((p,k)=>c.drawImage(SP.star,p[0],p[1],22,23));
  } else if(i===2){
    shape(c,ellP(205,54,32,32,rr,14,.02),'#FFF1C9',{a:.95});
    curve(c,[{x:192,y:46},{x:198,y:44},{x:203,y:48}],'#5B4338',2,.9);
    curve(c,[{x:208,y:48},{x:213,y:44},{x:219,y:46}],'#5B4338',2,.9);
    hl(c,197,52,3,2,'#5B4338',.85);hl(c,214,52,3,2,'#5B4338',.85);
    curve(c,[{x:190,y:62},{x:205,y:76},{x:222,y:60}],'#5B4338',2,.9);
    curve(c,[{x:200,y:67},{x:200,y:71}],'#FFFFFF',2.4,.95);curve(c,[{x:210,y:69},{x:210,y:72}],'#FFFFFF',2.4,.95);
    for(const [x,y,r] of [[150,86,-.5],[178,110,.5]]){c.save();c.translate(x,y);c.rotate(r);shape(c,ellP(0,0,13,7.5,rr,12,.03),'#E7889A');hl(c,-3,-2,4,2,'#FFD4DC',.8);c.restore();}
    c.drawImage(SP.heart,150,30,26,28);c.drawImage(SP.heart,236,100,22,24);
    [[140,16],[250,20],[120,60]].forEach((p,k)=>c.drawImage(SP.spark[k%3],p[0],p[1],14,14));
  } else if(i===3){
    spr(c,SP.cloud[0][1],140,16,1.15);
    curve(c,[{x:172,y:56},{x:184,y:62}],'#5B4338',2.2,.9);curve(c,[{x:220,y:62},{x:232,y:56}],'#5B4338',2.2,.9);
    hl(c,184,68,3,3.4,'#5B4338',.9);hl(c,220,68,3,3.4,'#5B4338',.9);
    hl(c,172,78,7,4,'#F49AAA',.6);hl(c,232,78,7,4,'#F49AAA',.6);
    curve(c,[{x:192,y:86},{x:202,y:80},{x:212,y:86}],'#5B4338',2,.9);
    c.drawImage(SP.heart,236,20,20,22);c.drawImage(SP.heart,146,104,18,20);c.drawImage(SP.heart,250,96,16,18);
  } else {
    // campo de trigo dorado (el color del pelo del Principito)
    const wheat=(x,base,top,lean)=>{
      curve(c,[{x:x,y:base},{x:x+lean*.4,y:(base+top)/2},{x:x+lean,y:top}],'#C9A65A',1.4,.9);
      hl(c,x+lean,top-3,2.6,5,'#F2CF70',.95);
      hl(c,x+lean-2.4,top+1,2.2,4,'#EBC45E',.9);hl(c,x+lean+2.4,top+1,2.2,4,'#EBC45E',.9);
      curve(c,[{x:x+lean,y:top-8},{x:x+lean,y:top-11}],'#C9A65A',.9,.8);
    };
    for(let k=0;k<20;k++){const x=142+k*6.4+rr()*3,top=88+rr()*24;wheat(x,148,top,(rr()-.5)*8);}
    for(let k=0;k<6;k++){const x=22+k*7+rr()*3,top=122+rr()*8;wheat(x,148,top,(rr()-.5)*6);}
    c.drawImage(SP.heart,146,26,24,26);c.drawImage(SP.heart,244,22,18,20);
    [[130,12],[196,20],[258,64]].forEach((p,k)=>c.drawImage(SP.spark[k%3],p[0],p[1],15,15));
    c.drawImage(SP.star,120,54,20,21);
  }
}
function openLetter(i){
  illus(i,$('lCv'));$('lTxt').textContent=LETTERS[i];
  const s=$('sLetter');s.classList.remove('on');void s.offsetWidth;s.classList.add('on');sfx('buy');
}

/* ================= ENTRADA ================= */
const keys={l:false,r:false},ptr=new Map();
function setInput(){let l=keys.l,r=keys.r;for(const s of ptr.values()){if(s<0)l=true;else r=true;}input=(r?1:0)-(l?1:0);}
function bindInput(){
  const cv=$('c');
  const side=e=>{const r=cv.getBoundingClientRect();return(e.clientX-r.left)<r.width/2?-1:1;};
  cv.addEventListener('pointerdown',e=>{audio();if(state!=='play')return;ptr.set(e.pointerId,side(e));try{cv.setPointerCapture(e.pointerId);}catch(_){}setInput();e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId)){ptr.set(e.pointerId,side(e));setInput();}});
  const up=e=>{ptr.delete(e.pointerId);setInput();};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.l=true;
    else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.r=true;
    else if((e.key==='Escape'||e.key==='p')&&state==='play')pauseGame();
    else if((e.key==='Escape'||e.key==='p')&&state==='pause')resumeGame();
    setInput();
  });
  addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.l=false;
    else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.r=false;
    setInput();
  });
  addEventListener('blur',()=>{ptr.clear();keys.l=keys.r=false;setInput();});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('pointerdown',audio,{once:false});
}
function bindUI(){
  $('bPlay').onclick=play;
  $('bShop').onclick=openShop;
  $('bSnd').onclick=()=>{save.sound=!save.sound;persist();updateMenu();audio();sfx('star');};
  $('bShopBack').onclick=()=>{toMenu();};
  $('bSimple').onclick=()=>{save.equipped=0;persist();renderShop();};
  $('bLetterClose').onclick=()=>{$('sLetter').classList.remove('on');renderShop();};
  $('bAgain').onclick=play;
  $('bOverShop').onclick=openShop;
  $('bOverMenu').onclick=toMenu;
  $('btnPause').onclick=pauseGame;
  $('bResume').onclick=resumeGame;
  $('bQuit').onclick=()=>{ptr.clear();setInput();toMenu();};
}

/* ================= TAMAÑO Y BUCLE ================= */
let rsT=0;
function resize(){
  const vw=innerWidth,vh=innerHeight,w=Math.min(vw,vh*9/16),h=w*16/9,g=$('game');
  g.style.width=w+'px';g.style.height=h+'px';g.style.setProperty('--u',(w/360)+'px');
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  S=Math.max(1,Math.min(3,w*dpr/W));
  const cv=$('c');cv.width=Math.round(W*S);cv.height=Math.round(H*S);
  buildSprites();
}
addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{resize();if($('sShop').classList.contains('on'))renderShop();},150);});

let last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  if(!last)last=t;
  const d=Math.min(50,t-last);last=t;acc+=d;
  while(acc>=16.667){step();acc-=16.667;}
  render();
}

/* ================= INICIO ================= */
load();
ctx=$('c').getContext('2d');
buildPaper();
resize();
bindInput();
bindUI();
toMenu();
requestAnimationFrame(frame);
})();
</script>
